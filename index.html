<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Online Examination System</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">🎓 Online Examination System</div><span class="header-tag">Simple • Secure • Efficient</span></header>
<main class="container"><section id="loginCard" class="card login-card"><h1>Welcome to Online Exam</h1><p>Enter your name to begin the practice examination.</p><form id="loginForm"><label for="studentName">Student Name</label><input id="studentName" name="name" placeholder="Enter your full name" required><button type="submit">Start Exam</button></form><small>5 questions • Multiple choice • Instant result</small></section>
<section id="examCard" class="card hidden"><div class="exam-head"><div><h2 id="examTitle">Java & Web Basics</h2><p id="studentWelcome"></p></div><div class="timer" id="timer">05:00</div></div><form id="examForm"><div id="questions"></div><button type="submit">Submit Exam</button><button type="button" class="secondary" id="cancelBtn">Exit Exam</button></form></section>
<section id="resultCard" class="card hidden"><div class="result-icon">✓</div><h1>Exam Completed!</h1><p id="resultName"></p><div id="score" class="score"></div><p id="resultMessage"></p><button id="restartBtn">Take Exam Again</button></section></main><footer>Mini Project • HTML, CSS and Java</footer><script src="app.js"></script></body></html>
